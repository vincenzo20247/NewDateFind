<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPay | Official Payment Tool</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/?size=80&id=UpnwZDa50fGv&format=png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }

        .app-container {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }

        .tab-wrapper {
            background: #f9fafb;
            padding: 4px;
            border-radius: 8px;
            display: flex;
            border: 1px solid #e5e7eb;
        }

        .tab-btn {
            flex: 1;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            color: #4b5563;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #2563eb;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
        }

        .input-field {
            font-size: 14px;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            width: 100%;
            transition: border-color 0.15s ease;
        }

        .date-input {
            font-size: 12px !important; 
            padding: 8px 4px !important;
        }

        .input-field:focus {
            outline: none;
            border-color: #2563eb;
        }

        .label-text {
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 4px;
            display: block;
        }

        .btn-outline {
            border: 1px solid #d1d5db;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 6px;
            color: #374151;
        }

        .btn-outline:hover { background: #f9fafb; }

        .result-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px;
            margin-top: 20px;
        }

        /* Custom Modal Styles */
        #confirmModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 12px;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div id="confirmModal">
        <div class="modal-content">
            <div class="mb-4 text-red-500 flex justify-center">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h3 class="text-lg font-bold text-gray-900 mb-2">Reset Tab?</h3>
            <p class="text-sm text-gray-500 mb-6">Are you sure you want to clear all fields in this section?</p>
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 px-4 py-2 border border-gray-200 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">Cancel</button>
                <button id="confirmBtn" class="flex-1 px-4 py-2 bg-red-600 rounded-lg text-sm font-medium text-white hover:bg-red-700">Reset</button>
            </div>
        </div>
    </div>

    <div class="app-container rounded-xl w-full max-w-lg overflow-hidden">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-6 border-b pb-4">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div>
                    <h1 class="text-lg font-700 text-gray-900 leading-tight">Payment Calculator</h1>
                    <p class="text-xs text-gray-500">Official Agent Portal Utility</p>
                </div>
            </div>

            <div class="tab-wrapper mb-6">
                <button id="tab-paymentDateCalc" class="tab-btn active" onclick="showTab('paymentDateCalc')">Date Range</button>
                <button id="tab-amountDateCalc" class="tab-btn" onclick="showTab('amountDateCalc')">Amount Basis</button>
                <button id="tab-dateOffsetCalc" class="tab-btn" onclick="showTab('dateOffsetCalc')">Date Offset</button>
            </div>

            <div id="paymentDateCalc" class="tab-content space-y-4">
                <div class="space-y-4">
                    <div>
                        <label class="label-text">From Date</label>
                        <div class="flex gap-1">
                            <input type="number" id="lastPaymentDay" placeholder="DD" class="input-field date-input text-center" oninput="updateCalculation('paymentDateCalc')">
                            <input type="number" id="lastPaymentMonth" placeholder="MM" class="input-field date-input text-center" oninput="updateCalculation('paymentDateCalc')">
                            <input type="number" id="lastPaymentYear" placeholder="YYYY" class="input-field date-input text-center" oninput="updateCalculation('paymentDateCalc')">
                        </div>
                    </div>
                    <div>
                        <label class="label-text">To Date</label>
                        <div class="flex gap-1">
                            <input type="number" id="endPaymentDay" placeholder="DD" class="input-field date-input text-center" oninput="updateCalculation('paymentDateCalc')">
                            <input type="number" id="endPaymentMonth" placeholder="MM" class="input-field date-input text-center" oninput="updateCalculation('paymentDateCalc')">
                            <input type="number" id="endPaymentYear" placeholder="YYYY" class="input-field date-input text-center" oninput="updateCalculation('paymentDateCalc')">
                        </div>
                    </div>
                </div>
                <p id="dateCalcError" class="text-[10px] text-red-500 mt-1 h-2"></p>

                <div class="flex items-center gap-2 py-1">
                    <input type="checkbox" id="skip31stDay" class="w-4 h-4 text-blue-600 rounded border-gray-300" onchange="updateCalculation('paymentDateCalc')">
                    <label for="skip31stDay" class="text-xs font-medium text-gray-600">Exclude 31st day</label>
                </div>

                <div id="dailyAmounts" class="grid grid-cols-3 gap-2"></div>

                <div class="flex gap-2 pt-2">
                    <button onclick="addDailyAmountRow('paymentDateCalc')" class="btn-outline flex-1 text-xs">+ Add Amount</button>
                    <button onclick="clearFields('paymentDateCalc')" class="btn-outline text-xs">Reset</button>
                </div>

                <div id="resultPaymentDate"></div>
            </div>

            <div id="amountDateCalc" class="tab-content hidden space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="label-text">Daily Amount</label>
                        <input type="number" id="dailyAmount" class="input-field date-input font-semibold" placeholder="₹ 0" oninput="validateDailyAmount()">
                        <p id="dailyAmountError" class="text-[10px] text-red-500 mt-1"></p>
                    </div>
                    <div>
                        <label class="label-text">Total Received</label>
                        <input type="number" id="totalAmountPaid" class="input-field date-input font-semibold" placeholder="₹ 0" oninput="validateTotalAmount()" disabled>
                        <p id="totalAmountError" class="text-[10px] text-red-500 mt-1"></p>
                    </div>
                </div>

                <div>
                    <label class="label-text">Last Payment Date</label>
                    <div class="flex gap-2">
                        <div class="flex flex-1 gap-1">
                            <input type="number" id="lastAmountPaymentDay" class="input-field date-input text-center" oninput="updateCalculation('amountDateCalc')">
                            <input type="number" id="lastAmountPaymentMonth" class="input-field date-input text-center" oninput="updateCalculation('amountDateCalc')">
                            <input type="number" id="lastAmountPaymentYear" class="input-field date-input text-center" oninput="updateCalculation('amountDateCalc')">
                        </div>
                        <button onclick="clearFields('amountDateCalc')" class="btn-outline text-xs">Reset</button>
                    </div>
                    <p id="amountDateError" class="text-[10px] text-red-500 mt-1 h-2"></p>
                </div>

                <div id="resultAmountDate"></div>
            </div>

            <div id="dateOffsetCalc" class="tab-content hidden space-y-4">
                <div>
                    <label class="label-text">Base Date</label>
                    <div class="flex gap-1">
                        <input type="number" id="baseDay" placeholder="DD" class="input-field date-input text-center" oninput="calculateSeparateOffset()">
                        <input type="number" id="baseMonth" placeholder="MM" class="input-field date-input text-center" oninput="calculateSeparateOffset()">
                        <input type="number" id="baseYear" placeholder="YYYY" class="input-field date-input text-center" oninput="calculateSeparateOffset()">
                    </div>
                    <p id="baseDateError" class="text-[10px] text-red-500 mt-1 h-2"></p>
                </div>

                <div>
                    <label class="label-text">Add / Subtract Days</label>
                    <div class="flex gap-2">
                        <input type="number" id="baseOffsetDays" placeholder="Example: 10 or -10" class="input-field date-input font-medium h-10" oninput="calculateSeparateOffset()">
                        <button onclick="clearFields('dateOffsetCalc')" class="btn-outline text-xs">Reset</button>
                    </div>
                    <p class="text-[10px] text-gray-400 mt-1">Use negative (-) to go backward</p>
                </div>

                <div id="resultOffsetDate"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setDefaultDates();
            addDailyAmountRow('paymentDateCalc');
        });

        function setDefaultDates() {
            const today = new Date();
            const d = today.getDate(), m = today.getMonth() + 1, y = today.getFullYear();
            const ids = ['lastPaymentDay', 'lastPaymentMonth', 'lastPaymentYear', 'endPaymentDay', 'endPaymentMonth', 'endPaymentYear', 'lastAmountPaymentDay', 'lastAmountPaymentMonth', 'lastAmountPaymentYear', 'baseDay', 'baseMonth', 'baseYear'];
            ids.forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    if(id.includes('Year')) el.value = y;
                    else if(id.includes('Month')) el.value = m;
                    else el.value = d;
                }
            });
        }

        function isValidDate(d, m, y) {
            const date = new Date(y, m - 1, d);
            return date.getFullYear() === y && date.getMonth() === m - 1 && date.getDate() === d;
        }

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        function addDailyAmountRow(tabId) {
            const container = document.getElementById('dailyAmounts');
            const div = document.createElement('div');
            div.className = 'relative';
            div.innerHTML = `<input type="number" placeholder="Amt" class="input-field pr-6 text-center font-medium date-input" oninput="updateCalculation('${tabId}')"><button onclick="this.parentElement.remove(); updateCalculation('${tabId}')" class="absolute right-1 top-1/2 -translate-y-1/2 text-gray-400 hover:text-red-500 text-lg">&times;</button>`;
            container.appendChild(div);
        }

        function updateCalculation(tabId) {
            if (tabId === 'paymentDateCalc') {
                const sD = parseInt(document.getElementById("lastPaymentDay").value);
                const sM = parseInt(document.getElementById("lastPaymentMonth").value);
                const sY = parseInt(document.getElementById("lastPaymentYear").value);
                const eD = parseInt(document.getElementById("endPaymentDay").value);
                const eM = parseInt(document.getElementById("endPaymentMonth").value);
                const eY = parseInt(document.getElementById("endPaymentYear").value);
                const skip = document.getElementById("skip31stDay").checked;
                const errEl = document.getElementById("dateCalcError");

                if (!sD || !eD || !sM || !eM || !sY || !eY) return;
                if (!isValidDate(sD, sM, sY) || !isValidDate(eD, eM, eY)) {
                    errEl.textContent = "Please enter a valid date (Check DD/MM)";
                    document.getElementById("resultPaymentDate").innerHTML = "";
                    return;
                }
                errEl.textContent = "";

                const start = new Date(sY, sM - 1, sD);
                const end = new Date(eY, eM - 1, eD);
                let days = 0;
                for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                    if (!(skip && d.getDate() === 31)) days++;
                }

                let total = 0;
                let rows = '';
                document.querySelectorAll('#dailyAmounts input').forEach((input, i) => {
                    const val = parseFloat(input.value) || 0;
                    if (val > 0) {
                        total += (days * val);
                        rows += `<div class="flex justify-between text-[12px] py-1 border-b border-gray-200"><span class="text-gray-500">Amount ${i+1} (₹${val})</span><span class="font-medium text-gray-700">₹${(days * val).toLocaleString()}</span></div>`;
                    }
                });

                if (total > 0) {
                    document.getElementById("resultPaymentDate").innerHTML = `<div class="result-box"><div class="flex justify-between items-center mb-3"><span class="text-[11px] font-bold text-gray-400 uppercase">Summary</span><span class="text-[11px] font-semibold bg-blue-100 text-blue-700 px-2 py-0.5 rounded">${days} Days</span></div>${rows}<div class="flex justify-between items-center mt-3 pt-2"><span class="text-[13px] font-bold text-gray-900">Total Payable</span><span class="text-lg font-bold text-blue-600">₹${total.toLocaleString()}</span></div></div>`;
                }
            } else if (tabId === 'amountDateCalc') {
                const daily = parseFloat(document.getElementById("dailyAmount").value);
                const paid = parseFloat(document.getElementById("totalAmountPaid").value);
                const d = parseInt(document.getElementById("lastAmountPaymentDay").value);
                const m = parseInt(document.getElementById("lastAmountPaymentMonth").value);
                const y = parseInt(document.getElementById("lastAmountPaymentYear").value);
                const totalErr = document.getElementById("totalAmountError").textContent;
                const dateErrEl = document.getElementById("amountDateError");
                const resultDiv = document.getElementById("resultAmountDate");

                if (document.getElementById("dailyAmountError").textContent !== "" || totalErr !== "") {
                    resultDiv.innerHTML = `<div class="result-box bg-red-50 border-red-100 text-center"><p class="text-lg font-bold text-red-900">Invalid Amount</p></div>`;
                    return;
                }
                if (!d || !m || !y) return;
                if (!isValidDate(d, m, y)) {
                    dateErrEl.textContent = "Please enter a valid date";
                    resultDiv.innerHTML = "";
                    return;
                }
                dateErrEl.textContent = "";
                if (daily && paid) {
                    const lastDate = new Date(y, m-1, d);
                    const period = Math.floor(paid / daily);
                    const endDate = new Date(lastDate);
                    endDate.setDate(lastDate.getDate() + period);
                    const fmt = endDate.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                    resultDiv.innerHTML = `<div class="result-box bg-blue-50 border-blue-100 text-center"><p class="text-[11px] text-blue-600 font-semibold mb-1 uppercase tracking-wider">Valid Until</p><p class="text-xl font-bold text-blue-900">${fmt}</p><p class="text-[10px] text-blue-500 mt-1 font-medium">Covers a period of ${period} days</p></div>`;
                }
            }
        }

        function validateDailyAmount() {
            const val = parseFloat(document.getElementById("dailyAmount").value);
            const isOk = !isNaN(val) && val > 0 && val % 10 === 0;
            document.getElementById("dailyAmountError").textContent = isOk ? "" : "Multiple of 10 required";
            document.getElementById("totalAmountPaid").disabled = !isOk;
            updateCalculation('amountDateCalc');
        }

        function validateTotalAmount() {
            const daily = parseFloat(document.getElementById("dailyAmount").value);
            const total = parseFloat(document.getElementById("totalAmountPaid").value);
            const isOk = !isNaN(total) && total % daily === 0;
            document.getElementById("totalAmountError").textContent = isOk ? "" : `Multiple of ${daily} required`;
            updateCalculation('amountDateCalc');
        }

        function calculateSeparateOffset() {
            const d = parseInt(document.getElementById("baseDay").value);
            const m = parseInt(document.getElementById("baseMonth").value);
            const y = parseInt(document.getElementById("baseYear").value);
            const offset = parseInt(document.getElementById("baseOffsetDays").value);
            const resDiv = document.getElementById("resultOffsetDate");
            const errEl = document.getElementById("baseDateError");

            if (!d || !m || !y) return;
            if (!isValidDate(d, m, y)) {
                errEl.textContent = "Please enter a valid date";
                resDiv.innerHTML = "";
                return;
            }
            errEl.textContent = "";
            if (isNaN(offset)) {
                resDiv.innerHTML = "";
                return;
            }
            const date = new Date(y, m - 1, d);
            date.setDate(date.getDate() + offset);
            const fmt = date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            resDiv.innerHTML = `<div class="result-box bg-blue-50 border-blue-100 text-center"><p class="text-[11px] text-blue-600 font-semibold mb-1 uppercase tracking-wider">Calculated Target Date</p><p class="text-xl font-bold text-blue-900">${fmt}</p><p class="text-[10px] text-blue-500 mt-1 font-medium">${Math.abs(offset)} days ${offset >= 0 ? 'forward' : 'backward'}</p></div>`;
        }

        function clearFields(tabId) {
            const modal = document.getElementById('confirmModal');
            const confirmBtn = document.getElementById('confirmBtn');
            modal.style.display = 'flex';
            
            confirmBtn.onclick = () => {
                if (tabId === 'paymentDateCalc') {
                    setDefaultDates();
                    document.getElementById('dailyAmounts').innerHTML = '';
                    addDailyAmountRow('paymentDateCalc');
                    document.getElementById('resultPaymentDate').innerHTML = '';
                    document.getElementById('skip31stDay').checked = false;
                    document.getElementById('dateCalcError').textContent = '';
                } else if (tabId === 'amountDateCalc') {
                    document.getElementById('dailyAmount').value = '';
                    document.getElementById('totalAmountPaid').value = '';
                    document.getElementById('totalAmountPaid').disabled = true;
                    document.getElementById('dailyAmountError').textContent = '';
                    document.getElementById('totalAmountError').textContent = '';
                    document.getElementById('amountDateError').textContent = '';
                    document.getElementById('resultAmountDate').innerHTML = '';
                    setDefaultDates();
                } else if (tabId === 'dateOffsetCalc') {
                    document.getElementById('baseOffsetDays').value = '';
                    document.getElementById('resultOffsetDate').innerHTML = '';
                    document.getElementById('baseDateError').textContent = '';
                    setDefaultDates();
                }
                closeModal();
            };
        }

        function closeModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }
    </script>
</body>
</html>
